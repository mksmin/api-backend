name: Python checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "pyproject.toml"
      - "poetry.lock"

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install poetry
        run: |
          export POETRY_HOME="opt/poetry"
          python3 -m venv $POETRY_HOME
          export PATH="$POETRY_HOME/bin:$PATH"
          pip install "poetry==2.3.2"
          echo "$POETRY_HOME/bin" >> $GITHUB_PATH

      - name: Poetry config disable virtualenv
        if: ${{ !env.ACT }}
        run: |
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: |
          poetry sync --no-root --no-interaction --no-ansi

      - name: Run Black
        run: black --check --diff ./

      - name: Run ruff check --diff
        uses: astral-sh/ruff-action@v3
        with:
          args: 'check --diff'
          version-file: 'pyproject.toml'

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version-file: 'pyproject.toml'

      - name: Run mypy
        run: mypy app

      - name: Run tests with LMS enabled and disabled
        env:
          PYTHONPATH: app
          API_CONFIG__RUN__DEV_MODE: "false"
          API_CONFIG__BOTS: "{}"
          API_CONFIG__ACCESS_TOKEN__SECRETS__SECRET: "ci-only-jwt-secret-32-characters-long"
          API_CONFIG__SECRETS__SESSION_SECRET: "ci-only-session-secret"
          API_CONFIG__SECRETS__CSRF_SECRET: "ci-only-csrf-secret"
          API_CONFIG__DB__USER: "test"
          API_CONFIG__DB__PASSWORD: "test"
          API_CONFIG__RABBIT__SECRETS__USERNAME: "test"
          API_CONFIG__RABBIT__SECRETS__PASSWORD: "test"
          API_CONFIG__S3__ACCESS_KEY: "test"
          API_CONFIG__S3__SECRET_KEY: "test"
          API_CONFIG__S3__ENDPOINT_URL: "http://localhost:9000"
          API_CONFIG__S3__BUCKET_NAME: "test"
        run: |
          mkdir -p ../frontend/static

          API_CONFIG__LMS__ENABLED=true poetry run pytest app/tests -v
          API_CONFIG__LMS__ENABLED=false poetry run pytest app/tests -v