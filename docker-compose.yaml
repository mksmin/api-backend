services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-backend:local
    container_name: api-app
    ports:
      - "127.0.0.1:8085:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Moscow
    env_file:
      - ./app/.env
    volumes:
      - /srv/api-app/api-frontend:/frontend
      - ./app/config.local.yaml:/backend/app/config.local.yaml
      - /etc/localtime:/etc/localtime:ro
      - /var/run/postgresql:/var/run/postgresql:ro
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
